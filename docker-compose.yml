services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: &db_name xmldb
      POSTGRES_USER: &db_user xmldb
      POSTGRES_PASSWORD: &db_password xmldb
    ports:
      - "5432:5432"
    volumes:
      - ./src/main/resources/db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xmldb -d xmldb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: *db_name
      DB_USER: *db_user
      DB_PASSWORD: *db_password

volumes:
  pgdata:
